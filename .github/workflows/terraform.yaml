name: Terraform

on:
  pull_request:
    branches: [main]
    paths:
      - "environments/**"
      - "modules/**"
  push:
    branches: [main]
    paths:
      - "environments/**"
      - "modules/**"

permissions:
  contents: read
  id-token: write
  pull-requests: write

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      envs: ${{ steps.detect.outputs.envs }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: detect
        name: Detect changed environments
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          else
            BASE="${{ github.event.before }}"
          fi

          CHANGED=$(git diff --name-only "${BASE}" HEAD)

          ENVS="[]"
          # If modules changed, run all environments
          if echo "${CHANGED}" | grep -q '^modules/'; then
            ENVS='["dev","stg","prod"]'
          else
            envs=()
            for env in dev stg prod; do
              if echo "${CHANGED}" | grep -q "^environments/${env}/"; then
                envs+=("\"${env}\"")
              fi
            done
            if [ ${#envs[@]} -gt 0 ]; then
              ENVS="[$(IFS=,; echo "${envs[*]}")]"
            fi
          fi

          echo "envs=${ENVS}" >> "$GITHUB_OUTPUT"
          echo "Detected environments: ${ENVS}"

  plan:
    needs: detect
    if: github.event_name == 'pull_request' && needs.detect.outputs.envs != '[]'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        env: ${{ fromJson(needs.detect.outputs.envs) }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9"

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.TF_SERVICE_ACCOUNT }}

      - name: Terraform Init
        working-directory: environments/${{ matrix.env }}
        run: terraform init

      - name: Terraform Plan
        id: plan
        working-directory: environments/${{ matrix.env }}
        run: terraform plan -no-color -out=tfplan 2>&1 | tee plan.txt

      - name: Comment PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('environments/${{ matrix.env }}/plan.txt', 'utf8');
            const body = `### Terraform Plan — \`${{ matrix.env }}\`
            \`\`\`
            ${plan.slice(-60000)}
            \`\`\``;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body,
            });

  apply:
    needs: detect
    if: github.event_name == 'push' && needs.detect.outputs.envs != '[]'
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 1
      matrix:
        env: ${{ fromJson(needs.detect.outputs.envs) }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9"

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.TF_SERVICE_ACCOUNT }}

      - name: Terraform Init
        working-directory: environments/${{ matrix.env }}
        run: terraform init

      - name: Terraform Apply
        working-directory: environments/${{ matrix.env }}
        run: terraform apply -auto-approve
