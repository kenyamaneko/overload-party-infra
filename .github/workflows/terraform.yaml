name: Terraform

on:
  pull_request:
    branches: [main]
    paths:
      - "providers/**"
  push:
    branches: [main]
    paths:
      - "providers/**"

permissions:
  contents: read
  id-token: write
  pull-requests: write

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      paths: ${{ steps.detect.outputs.paths }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: detect
        name: Detect changed environment paths
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: .github/scripts/detect-envs.sh

  plan:
    needs: detect
    if: github.event_name == 'pull_request' && needs.detect.outputs.paths != '[]'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        path: ${{ fromJson(needs.detect.outputs.paths) }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9"

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.TF_SERVICE_ACCOUNT }}

      - name: Terraform Init
        working-directory: providers/${{ matrix.path }}
        run: terraform init

      - name: Terraform Plan
        id: plan
        working-directory: providers/${{ matrix.path }}
        run: terraform plan -no-color -out=tfplan 2>&1 | tee plan.txt
        env:
          TF_VAR_cloudflare_cdn_api_token: ${{ secrets.CLOUDFLARE_CDN_API_TOKEN }}

      - name: Comment PR
        uses: actions/github-script@v7
        env:
          TF_ENV: ${{ matrix.path }}
        with:
          script: |
            const commentPlan = require('./.github/scripts/comment-plan.js');
            await commentPlan({ github, context });

  apply:
    needs: detect
    if: github.event_name == 'push' && needs.detect.outputs.paths != '[]'
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 1
      matrix:
        path: ${{ fromJson(needs.detect.outputs.paths) }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9"

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.TF_SERVICE_ACCOUNT }}

      - name: Terraform Init
        working-directory: providers/${{ matrix.path }}
        run: terraform init

      - name: Terraform Apply
        working-directory: providers/${{ matrix.path }}
        run: terraform apply -auto-approve
        env:
          TF_VAR_cloudflare_cdn_api_token: ${{ secrets.CLOUDFLARE_CDN_API_TOKEN }}
